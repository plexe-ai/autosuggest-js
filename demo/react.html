<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>plexe-autosuggest React demo</title>
<style>body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; background: #0b0b0d; color: #ededef; }</style>
<script type="importmap">
{ "imports": { "react": "https://esm.sh/react@18.3.1", "react-dom/client": "https://esm.sh/react-dom@18.3.1/client" } }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { createElement as h, useState } from "react";
  import { createRoot } from "react-dom/client";
  import { PlexeAutosuggest } from "../src/react.js";
  const q = new URLSearchParams(location.search);
  function App() {
    const [place, setPlace] = useState(null);
    const [err, setErr] = useState(null);
    return h("div", null,
      h("h1", { style: { fontSize: 20 } }, "React wrapper"),
      h(PlexeAutosuggest, { apiKey: q.get("key"), endpoint: q.get("endpoint") || undefined, theme: "dark",
        types: ["city", "airport"], limit: 5, onSelect: setPlace, onError: setErr }),
      h("p", { id: "picked" }, place ? `${place.name} (${place.id}), ${place.hotel_count} hotels` : "nothing picked"),
      err && h("p", { id: "err" }, `error ${err.status}: ${err.message}`));
  }
  createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
